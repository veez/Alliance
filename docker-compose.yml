# Продакшен-развёртывание портала Альянса.
#   cp .env.production.example .env  &&  заполнить секреты
#   docker compose up -d --build
# Приложение: http://<сервер>:8080 (поставьте перед ним HTTPS-прокси или используйте certbot в nginx).
services:
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alliance
      POSTGRES_USER: alliance
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alliance -d alliance']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:?Задайте APP_URL}
      DATABASE_URL: postgresql://alliance:${DB_PASSWORD}@db:5432/alliance?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Задайте JWT_ACCESS_SECRET}
      TOTP_ENC_KEY: ${TOTP_ENC_KEY:?Задайте TOTP_ENC_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      # Файлы — на томе `files` (S3/MinIO-драйвер подключается на этапе документов)
      STORAGE_DRIVER: local
      STORAGE_DIR: /data/files
    volumes:
      - files:/data/files

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    ports:
      - '${HTTP_PORT:-8080}:80'

volumes:
  pgdata:
  files:
