# Демо-стенд на Render (бесплатный план): веб-сервис + PostgreSQL Render.
# Бесплатная база Render живёт 30 дней, затем её нужно пересоздать (демо-данные зальются заново).
databases:
  - name: alliance-demo-db
    plan: free
    region: frankfurt
    databaseName: alliance
    user: alliance

services:
  - type: web
    name: alliance-portal-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alliance-demo-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: TOTP_ENC_KEY
        generateValue: true # 256 бит в base64 = 32 байта
      - key: COOKIE_SECURE
        value: 'true'
      - key: DEMO_DATA
        value: 'true' # демо-организации, голосования, взносы, мероприятия
      - key: DISABLE_2FA
        value: 'true' # демо: вход по паролю без второго фактора
